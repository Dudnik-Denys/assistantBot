# Локальная инфраструктура для разработки: Postgres и Redis.
# web/bot/worker запускаются напрямую через bun.
name: tgab-dev

# Версия Postgres — одна на всё: рабочая и тестовая базы. CI (.github/workflows/ci.yml) берёт
# тот же образ — меняя версию, поправь и его; restore-check.sh берёт образ работающей базы.
x-postgres-image: &postgres-image postgres:17-alpine

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: tgab
      POSTGRES_PASSWORD: tgab
      POSTGRES_DB: tgab
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgab -d tgab"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    # Готовность — ответ на PING: `docker compose up --wait` (run.sh) ждёт его, а не только старта.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Только для интеграционных тестов (`bun run test:integration` поднимает его сам).
  # Данные в памяти (tmpfs): после остановки ничего не остаётся, с рабочей базой не связан.
  postgres-test:
    image: *postgres-image
    profiles: [test]
    environment:
      POSTGRES_USER: tgab
      POSTGRES_PASSWORD: tgab
      POSTGRES_DB: tgab_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgab -d tgab_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  redis-data:

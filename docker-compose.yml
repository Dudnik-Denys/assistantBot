# Локальная инфраструктура для разработки: Postgres и Redis.
# web/bot/worker запускаются напрямую через bun.
name: tgab-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tgab
      POSTGRES_PASSWORD: tgab
      POSTGRES_DB: tgab
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgab -d tgab"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
